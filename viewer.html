<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{
var u=location.pathname,k="d62chk_"+u;
if(sessionStorage.getItem(k)==="1")return;
sessionStorage.setItem(k,"1");
Promise.all([fetch(u,{cache:"no-store"}).then(function(r){return r.text()}),fetch(u).then(function(r){return r.text()})]).then(function(a){
 if(a[0]!==a[1]){var q=location.search.replace(/([?&])_c=\d+&?/,"$1").replace(/[?&]$/,"");location.replace(u+(q?q+"&":"?")+"_c="+Date.now()+location.hash);}
}).catch(function(){});
}catch(e){}})();</script>
<title>D62 - Drawing</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
#st{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column}
#bar{flex:0 0 34px;background:#1f6fb5;color:#fff;display:flex;align-items:center;padding:0 10px;font-size:15px;box-sizing:border-box;gap:8px}
#bar a,#bar button{color:#fff;text-decoration:none;border:1px solid #fff;border-radius:3px;padding:2px 10px;background:transparent;font:inherit;cursor:pointer;line-height:22px}
#nm{flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:4px}
#zl{min-width:52px}
#main{flex:1 1 auto;display:flex;min-height:0;min-width:0}
#wrap{flex:1 1 0;min-width:0;overflow:auto;position:relative;background:#fff}
#pt{display:none}
#pt b{background:#fff;color:#1f6fb5;border-radius:9px;padding:0 6px;margin-left:5px;font-size:11px}
#pp{display:none;flex:0 0 auto;width:min(165px,27%);box-sizing:border-box;border-left:2px solid #1f6fb5;background:#f4f8fc;overflow:auto;-webkit-overflow-scrolling:touch}
#pp h3{margin:0;padding:4px 8px;font-size:12px;background:#1f6fb5;color:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
#pp h3 button{color:#fff;border:1px solid #fff;border-radius:3px;background:transparent;font:inherit;padding:0 6px;cursor:pointer}
.pc{margin:5px;padding:4px 7px;background:#fff;border:1px solid #b9cde3;border-radius:6px;cursor:pointer}
.pc.fl{background:#c9f5c9;border-color:#0a7d2c}
.pc .b{font-size:10px;color:#557}
.pc .m{font-size:15px;font-weight:bold;color:#0a5d1f;letter-spacing:.5px;margin:2px 0}
.pc .e{font-size:10.5px;line-height:1.25;color:#222;margin-top:2px;direction:auto}
.pc .n{font-size:10px;color:#667;margin-top:1px}
.pc .m+.n{margin-top:0}
#v{display:block;border:0;background:#fff}
@media (orientation:portrait) and (max-width:900px) and (hover:none) and (pointer:coarse){
 #st{width:100vh;width:100dvh;height:100vw;left:100vw;transform-origin:0 0;transform:rotate(90deg)}
}
</style>
</head>
<body>
<div id="st">
<div id="bar"><a href="index.html" id="back">&#8592; Back</a><span id="nm"></span><button id="pt" type="button">Parts<b id="pn">0</b></button><button id="zo" type="button">&#8722;</button><button id="zl" type="button">100%</button><button id="zi" type="button">+</button></div>
<div id="main"><div id="wrap"><iframe id="v" title="drawing"></iframe></div><div id="pp"><h3><span>Part codes</span><button id="px" type="button">&#10005;</button></h3><div id="pl"></div></div></div>
</div>
<script>
(function(){
try{if(sessionStorage.getItem("d62ok")!=="1"){location.replace("index.html");return;}}catch(e){}
var $=function(i){return document.getElementById(i)},wrap=$("wrap"),v=$("v"),z=1,MAXZ=8;
var f=new URLSearchParams(location.search).get("f")||"";
if(!/^[A-Za-z0-9_ ().\-]+\.svg$/i.test(f)){$("nm").textContent="Invalid file";return;}
$("nm").textContent=f;document.title="D62 - "+f;
var PORT=window.matchMedia("(orientation:portrait) and (max-width:900px) and (hover:none) and (pointer:coarse)");
function layout(){
 var st=$("st"),vv=window.visualViewport,W=Math.round(vv?vv.width:window.innerWidth),H=Math.round(vv?vv.height:window.innerHeight);
 if(PORT.matches){st.style.width=H+"px";st.style.height=W+"px";st.style.left=W+"px";}
 else{st.style.width=W+"px";st.style.height=H+"px";st.style.left="0";}
}
function applySize(){layout();v.style.width=Math.round(wrap.clientWidth*z)+"px";v.style.height=Math.round(wrap.clientHeight*z)+"px";$("zl").textContent=Math.round(z*100)+"%";}
function setZoom(nz,fx,fy){
 nz=Math.max(1,Math.min(MAXZ,nz));if(nz===z)return;
 if(fx==null){fx=wrap.clientWidth/2;fy=wrap.clientHeight/2;}
 var px=(wrap.scrollLeft+fx)/v.offsetWidth,py=(wrap.scrollTop+fy)/v.offsetHeight;
 z=nz;applySize();
 wrap.scrollLeft=px*v.offsetWidth-fx;wrap.scrollTop=py*v.offsetHeight-fy;
}
$("zi").addEventListener("click",function(){setZoom(z*1.5);});
$("zo").addEventListener("click",function(){setZoom(z/1.5);});
$("zl").addEventListener("click",function(){setZoom(1);wrap.scrollLeft=0;wrap.scrollTop=0;});
function relayout(){setTimeout(function(){applySize();try{var d=v.contentDocument;if(d)fitBox(d);}catch(e){}},150);}
window.addEventListener("resize",relayout);window.addEventListener("orientationchange",relayout);
if(window.visualViewport)window.visualViewport.addEventListener("resize",relayout);
$("back").addEventListener("click",function(e){if(history.length>1){e.preventDefault();history.back();}});
/* make the whole drawing visible: set the viewBox to the real bounds of everything drawn (table included) */
function contentBox(s){
 var ctm=s.getScreenCTM();if(!ctm)return null;
 var inv=ctm.inverse(),x0=1e12,y0=1e12,x1=-1e12,y1=-1e12,ok=false,pt=s.createSVGPoint();
 var skip={defs:1,style:1,script:1,title:1,desc:1,metadata:1,clippath:1,mask:1,lineargradient:1,radialgradient:1,pattern:1,marker:1,symbol:1};
 function add(x,y){pt.x=x;pt.y=y;var q=pt.matrixTransform(inv);
  if(q.x<x0)x0=q.x;if(q.x>x1)x1=q.x;if(q.y<y0)y0=q.y;if(q.y>y1)y1=q.y;}
 var k=s.children,i;
 for(i=0;i<k.length;i++){
  var n=(k[i].localName||"").toLowerCase();if(skip[n])continue;
  var r=k[i].getBoundingClientRect();if(!(r.width>0||r.height>0))continue;
  add(r.left,r.top);add(r.right,r.top);add(r.left,r.bottom);add(r.right,r.bottom);ok=true;
 }
 return ok?{x:x0,y:y0,r:x1,b:y1}:null;
}
function fitBox(d){try{
 var s=d.documentElement;
 if(!s.__vb0){
  var vb=(s.getAttribute("viewBox")||"").split(/[\s,]+/).map(parseFloat);
  if(vb.length===4&&vb[2]>0&&vb[3]>0)s.__vb0=vb;
  else{var w=parseFloat(s.getAttribute("width")),h=parseFloat(s.getAttribute("height"));
   s.__vb0=(w>0&&h>0)?[0,0,w,h]:null;}
 }
 var o=s.__vb0,bb=s.getBBox(),c=contentBox(s);
 var x=bb.x,y=bb.y,r=bb.x+bb.width,b=bb.y+bb.height;
 if(!(bb.width>0&&bb.height>0)){x=1e12;y=1e12;r=-1e12;b=-1e12;}
 if(c){x=Math.min(x,c.x);y=Math.min(y,c.y);r=Math.max(r,c.r);b=Math.max(b,c.b);}
 if(o){x=Math.min(x,o[0]);y=Math.min(y,o[1]);r=Math.max(r,o[0]+o[2]);b=Math.max(b,o[1]+o[3]);}
 if(!(r>x&&b>y))return;
 if(o&&((r-x)>o[2]*6||(b-y)>o[3]*6))return;   /* ignore absurd bounds */
 var p=Math.max(r-x,b-y)*0.01;
 s.setAttribute("viewBox",(x-p)+" "+(y-p)+" "+(r-x+2*p)+" "+(b-y+2*p));
 s.setAttribute("preserveAspectRatio","xMidYMid meet");
 s.setAttribute("width","100%");s.setAttribute("height","100%");
}catch(e){}}
/* one finger = pan, two fingers = pinch zoom (inside the drawing) */
function attach(d){
 try{d.documentElement.style.touchAction="none";}catch(e){}
 var mode=0,a={},moved=false,d0=0,z0=1,m0={fx:0,fy:0};
 function dist(p,q){return Math.hypot(p.clientX-q.clientX,p.clientY-q.clientY);}
 function startPan(t,mv){mode=1;moved=mv;a={x:t.clientX,y:t.clientY,sx:t.screenX,sy:t.screenY};}
 d.addEventListener("touchstart",function(e){
  var t=e.touches;
  if(t.length===1){startPan(t[0],false);}
  else if(t.length===2){
   mode=2;d0=dist(t[0],t[1])||1;z0=z;
   m0={fx:((t[0].clientX+t[1].clientX)/2)/v.offsetWidth,fy:((t[0].clientY+t[1].clientY)/2)/v.offsetHeight};
  }
 },{passive:true});
 d.addEventListener("touchmove",function(e){
  var t=e.touches;
  if(mode===1&&t.length===1){
   if(!moved&&Math.hypot(t[0].screenX-a.sx,t[0].screenY-a.sy)>8)moved=true;
   if(moved){e.preventDefault();wrap.scrollLeft+=a.x-t[0].clientX;wrap.scrollTop+=a.y-t[0].clientY;}
  }else if(mode===2&&t.length>=2){
   e.preventDefault();
   var mx=(t[0].clientX+t[1].clientX)/2-wrap.scrollLeft,my=(t[0].clientY+t[1].clientY)/2-wrap.scrollTop;
   z=Math.max(1,Math.min(MAXZ,z0*dist(t[0],t[1])/d0));applySize();
   wrap.scrollLeft=m0.fx*v.offsetWidth-mx;wrap.scrollTop=m0.fy*v.offsetHeight-my;
  }
 },{passive:false});
 function end(e){var t=e.touches;if(t.length===1)startPan(t[0],true);else if(t.length===0)mode=0;}
 d.addEventListener("touchend",end,{passive:true});
 d.addEventListener("touchcancel",end,{passive:true});
}
/* ---- part codes: BOM code in the drawing -> material code from parts.json ---- */
var partsP=fetch("parts.json",{cache:"no-cache"}).then(function(r){return r.json();}).catch(function(){return {};});
function nk(t){return String(t||"").replace(/[\s\u00a0\u200c\u200b]+/g,"").toUpperCase();}
var pp=$("pp"),pl=$("pl"),pt=$("pt"),pn=$("pn"),cards={};
function pStore(v1){try{sessionStorage.setItem("d62pp",v1);}catch(e){}}
function pPref(){try{return sessionStorage.getItem("d62pp");}catch(e){return null;}}
function showPanel(on,save){
 pp.style.display=on?"block":"none";
 if(save)pStore(on?"1":"0");
 relayout();
}
pt.addEventListener("click",function(){showPanel(pp.style.display!=="block",true);});
$("px").addEventListener("click",function(){showPanel(false,true);});
function flash(k){
 var c=cards[k];if(!c)return;
 showPanel(true,false);
 setTimeout(function(){try{c.scrollIntoView({block:"center"});}catch(e){}c.className="pc fl";setTimeout(function(){c.className="pc";},1400);},200);
}
function copyText(t){
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return;}}catch(e){}
 try{var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);}catch(e){}
}
function renderPanel(list,P){
 pl.innerHTML="";cards={};
 list.forEach(function(it){
  P[it.k].forEach(function(m,idx){
   var c=document.createElement("div");c.className="pc";
   var b=document.createElement("div");b.className="b";b.textContent="BOM "+it.k;
   var mm=document.createElement("div");mm.className="m";mm.textContent=m[0];
   var bn=document.createElement("div");bn.className="n";bn.textContent=m[1]?("Bin: "+m[1]):"";
   var e=document.createElement("div");e.className="e";e.setAttribute("dir","auto");e.textContent=m[2];
   c.appendChild(b);c.appendChild(mm);if(m[1])c.appendChild(bn);c.appendChild(e);
   c.addEventListener("click",function(){copyText(m[0]);c.className="pc fl";setTimeout(function(){c.className="pc";},700);});
   pl.appendChild(c);
   if(idx===0)cards[it.k]=c;
  });
 });
}
function markParts(d){
 partsP.then(function(P){try{
  var NS="http://www.w3.org/2000/svg",tx=d.getElementsByTagName("text"),i,j,hx=[],list=[],seen={};
  for(i=0;i<tx.length;i++){var h=nk(tx[i].textContent);if(h.indexOf("CODICE")===0||h==="CODE")hx.push(parseFloat(tx[i].getAttribute("x")));}
  var found=[];
  for(i=0;i<tx.length;i++){
   var t=tx[i],k=nk(t.textContent);
   if(k.length<5||!P[k])continue;
   var x=parseFloat(t.getAttribute("x")),y=parseFloat(t.getAttribute("y"));
   if(hx.length){var ok=false;for(j=0;j<hx.length;j++)if(Math.abs(hx[j]-x)<0.8)ok=true;if(!ok)continue;}
   found.push({el:t,k:k,x:x,y:y});
  }
  found.forEach(function(f){
   var t=f.el;
   try{
    var bb=t.getBBox();
    if(bb.width>0){
     var r=d.createElementNS(NS,"rect");
     r.setAttribute("x",bb.x-0.5);r.setAttribute("y",bb.y-0.15);r.setAttribute("width",bb.width+1);r.setAttribute("height",bb.height+0.3);
     r.setAttribute("rx","0.6");r.setAttribute("fill","#b6f2b6");r.setAttribute("stroke","#0a7d2c");r.setAttribute("stroke-width","0.15");
     r.setAttribute("data-d62",f.k);r.style.cursor="pointer";
     t.parentNode.insertBefore(r,t);
    }
   }catch(e){}
   t.setAttribute("fill","#064d1b");t.setAttribute("font-weight","bold");t.setAttribute("data-d62",f.k);t.style.cursor="pointer";
   if(!seen[f.k]){seen[f.k]=1;list.push(f);}
  });
  list.sort(function(a,b){return a.x-b.x||a.y-b.y;});
  d.addEventListener("click",function(e){
   var el=e.target;
   while(el&&el.nodeType===1){var kk=el.getAttribute&&el.getAttribute("data-d62");if(kk){flash(kk);return;}el=el.parentNode;}
  },true);
  renderPanel(list,P);
  pn.textContent=list.length;
  if(list.length){pt.style.display="inline-block";if(pPref()!=="0")showPanel(true,false);}
  else{pt.style.display="none";showPanel(false,false);}
 }catch(e){}});
}
/* links inside the drawing (part numbers) must open INSIDE this viewer, so the bar (Back / zoom / fit) stays */
function keepInside(d){
 try{
  var w=v.contentWindow,as=d.getElementsByTagName("a"),i;
  for(i=0;i<as.length;i++)as[i].setAttribute("target","_self");
  d.addEventListener("click",function(e){var el=e.target;
   while(el&&el.nodeType===1){if(el.tagName&&el.tagName.toLowerCase()==="a")el.setAttribute("target","_self");el=el.parentNode;}
  },true);
  w.open=function(u){if(u)w.location.href=u;return w;};
 }catch(e){}
 try{
  var n=decodeURIComponent((v.contentWindow.location.pathname||"").split("/").pop());
  if(n){$("nm").textContent=n;document.title="D62 - "+n;}
 }catch(e){}
}
v.addEventListener("load",function(){pt.style.display="none";try{var d=v.contentDocument;if(d){z=1;applySize();wrap.scrollLeft=0;wrap.scrollTop=0;keepInside(d);markParts(d);fitBox(d);attach(d);setTimeout(function(){fitBox(d);},400);setTimeout(function(){fitBox(d);},1500);}}catch(e){}});
applySize();
v.src=encodeURIComponent(f).replace(/%28/g,"(").replace(/%29/g,")");
})();
</script>
</body>
</html>
