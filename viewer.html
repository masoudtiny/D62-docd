<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{
var u=location.pathname,k="d62chk_"+u;
if(sessionStorage.getItem(k)==="1")return;
sessionStorage.setItem(k,"1");
Promise.all([fetch(u,{cache:"no-store"}).then(function(r){return r.text()}),fetch(u).then(function(r){return r.text()})]).then(function(a){
 if(a[0]!==a[1]){var q=location.search.replace(/([?&])_c=\d+&?/,"$1").replace(/[?&]$/,"");location.replace(u+(q?q+"&":"?")+"_c="+Date.now()+location.hash);}
}).catch(function(){});
}catch(e){}})();</script>
<title>D62 - Drawing</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
#st{position:fixed;left:0;top:0;width:100vw;height:100vh;display:flex;flex-direction:column}
#bar{flex:0 0 34px;background:#1f6fb5;color:#fff;display:flex;align-items:center;padding:0 10px;font-size:15px;box-sizing:border-box;gap:8px}
#bar a,#bar button{color:#fff;text-decoration:none;border:1px solid #fff;border-radius:3px;padding:2px 10px;background:transparent;font:inherit;cursor:pointer;line-height:22px}
#nm{flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:4px}
#zl{min-width:52px}
#wrap{flex:1 1 auto;overflow:auto;position:relative;background:#fff}
#v{display:block;border:0;background:#fff}
@media (orientation:portrait) and (max-width:900px) and (hover:none) and (pointer:coarse){
 #st{width:100vh;height:100vw;left:100vw;transform-origin:0 0;transform:rotate(90deg)}
}
</style>
</head>
<body>
<div id="st">
<div id="bar"><a href="index.html" id="back">&#8592; Back</a><span id="nm"></span><button id="zo" type="button">&#8722;</button><button id="zl" type="button">100%</button><button id="zi" type="button">+</button></div>
<div id="wrap"><iframe id="v" title="drawing"></iframe></div>
</div>
<script>
(function(){
try{if(sessionStorage.getItem("d62ok")!=="1"){location.replace("index.html");return;}}catch(e){}
var $=function(i){return document.getElementById(i)},wrap=$("wrap"),v=$("v"),z=1,MAXZ=8;
var f=new URLSearchParams(location.search).get("f")||"";
if(!/^[A-Za-z0-9_ ().\-]+\.svg$/i.test(f)){$("nm").textContent="Invalid file";return;}
$("nm").textContent=f;document.title="D62 - "+f;
function applySize(){v.style.width=Math.round(wrap.clientWidth*z)+"px";v.style.height=Math.round(wrap.clientHeight*z)+"px";$("zl").textContent=Math.round(z*100)+"%";}
function setZoom(nz,fx,fy){
 nz=Math.max(1,Math.min(MAXZ,nz));if(nz===z)return;
 if(fx==null){fx=wrap.clientWidth/2;fy=wrap.clientHeight/2;}
 var px=(wrap.scrollLeft+fx)/v.offsetWidth,py=(wrap.scrollTop+fy)/v.offsetHeight;
 z=nz;applySize();
 wrap.scrollLeft=px*v.offsetWidth-fx;wrap.scrollTop=py*v.offsetHeight-fy;
}
$("zi").addEventListener("click",function(){setZoom(z*1.5);});
$("zo").addEventListener("click",function(){setZoom(z/1.5);});
$("zl").addEventListener("click",function(){setZoom(1);wrap.scrollLeft=0;wrap.scrollTop=0;});
window.addEventListener("resize",function(){setTimeout(applySize,150);});
$("back").addEventListener("click",function(e){if(history.length>1){e.preventDefault();history.back();}});
/* make the whole drawing visible: widen the viewBox to the real content bounds */
function fitBox(d){try{
 var s=d.documentElement,vb=(s.getAttribute("viewBox")||"").split(/[\s,]+/).map(parseFloat),bb=s.getBBox();
 if(vb.length===4&&bb.width>0&&bb.height>0&&bb.width<vb[2]*2&&bb.height<vb[3]*2){
  var x=Math.min(vb[0],bb.x),y=Math.min(vb[1],bb.y),r=Math.max(vb[0]+vb[2],bb.x+bb.width),b=Math.max(vb[1]+vb[3],bb.y+bb.height),p=(r-x)*0.01;
  s.setAttribute("viewBox",(x-p)+" "+(y-p)+" "+(r-x+2*p)+" "+(b-y+2*p));
 }
}catch(e){}}
/* one finger = pan, two fingers = pinch zoom (inside the drawing) */
function attach(d){
 try{d.documentElement.style.touchAction="none";}catch(e){}
 var mode=0,a={},moved=false,d0=0,z0=1,m0={fx:0,fy:0};
 function dist(p,q){return Math.hypot(p.clientX-q.clientX,p.clientY-q.clientY);}
 function startPan(t,mv){mode=1;moved=mv;a={x:t.clientX,y:t.clientY,sx:t.screenX,sy:t.screenY};}
 d.addEventListener("touchstart",function(e){
  var t=e.touches;
  if(t.length===1){startPan(t[0],false);}
  else if(t.length===2){
   mode=2;d0=dist(t[0],t[1])||1;z0=z;
   m0={fx:((t[0].clientX+t[1].clientX)/2)/v.offsetWidth,fy:((t[0].clientY+t[1].clientY)/2)/v.offsetHeight};
  }
 },{passive:true});
 d.addEventListener("touchmove",function(e){
  var t=e.touches;
  if(mode===1&&t.length===1){
   if(!moved&&Math.hypot(t[0].screenX-a.sx,t[0].screenY-a.sy)>8)moved=true;
   if(moved){e.preventDefault();wrap.scrollLeft+=a.x-t[0].clientX;wrap.scrollTop+=a.y-t[0].clientY;}
  }else if(mode===2&&t.length>=2){
   e.preventDefault();
   var mx=(t[0].clientX+t[1].clientX)/2-wrap.scrollLeft,my=(t[0].clientY+t[1].clientY)/2-wrap.scrollTop;
   z=Math.max(1,Math.min(MAXZ,z0*dist(t[0],t[1])/d0));applySize();
   wrap.scrollLeft=m0.fx*v.offsetWidth-mx;wrap.scrollTop=m0.fy*v.offsetHeight-my;
  }
 },{passive:false});
 function end(e){var t=e.touches;if(t.length===1)startPan(t[0],true);else if(t.length===0)mode=0;}
 d.addEventListener("touchend",end,{passive:true});
 d.addEventListener("touchcancel",end,{passive:true});
}
/* links inside the drawing (part numbers) must open INSIDE this viewer, so the bar (Back / zoom / fit) stays */
function keepInside(d){
 try{
  var w=v.contentWindow,as=d.getElementsByTagName("a"),i;
  for(i=0;i<as.length;i++)as[i].setAttribute("target","_self");
  d.addEventListener("click",function(e){var el=e.target;
   while(el&&el.nodeType===1){if(el.tagName&&el.tagName.toLowerCase()==="a")el.setAttribute("target","_self");el=el.parentNode;}
  },true);
  w.open=function(u){if(u)w.location.href=u;return w;};
 }catch(e){}
 try{
  var n=decodeURIComponent((v.contentWindow.location.pathname||"").split("/").pop());
  if(n){$("nm").textContent=n;document.title="D62 - "+n;}
 }catch(e){}
}
v.addEventListener("load",function(){try{var d=v.contentDocument;if(d){z=1;applySize();wrap.scrollLeft=0;wrap.scrollTop=0;keepInside(d);fitBox(d);attach(d);}}catch(e){}});
applySize();
v.src=encodeURIComponent(f).replace(/%28/g,"(").replace(/%29/g,")");
})();
</script>
</body>
</html>
