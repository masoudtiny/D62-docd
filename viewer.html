<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6fb5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Viewer</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff;
  font-family:Arial,Tahoma,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#bar{position:fixed;left:0;top:0;right:0;height:56px;background:#1f6fb5;color:#fff;z-index:10;
  display:flex;align-items:center;gap:14px;padding:0 12px;box-sizing:border-box;
  padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
#bar button{font:inherit;font-size:16px;color:#fff;background:transparent;border:1px solid #fff;
  border-radius:8px;padding:6px 14px;cursor:pointer}
#title{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:fixed;left:0;right:0;bottom:0;top:56px;overflow:hidden;touch-action:none;background:#fff}
#content{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#content svg{display:block}
#msg{position:absolute;left:0;right:0;top:40%;text-align:center;color:#555;font-size:16px}
</style>
</head>
<body>
<div id="bar">
  <button id="back" type="button">&larr; Back</button>
  <div id="title"></div>
  <button id="fit" type="button" title="Fit to screen">&#x2922; Fit</button>
</div>
<div id="stage"><div id="content"></div><div id="msg">Loading...</div></div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var file = q.get("f") || "";
  document.getElementById("title").textContent = file;
  document.title = file || "Viewer";

  document.getElementById("back").onclick = function(){
    if (history.length > 1) history.back(); else location.href = "index.html";
  };

  var stage = document.getElementById("stage");
  var content = document.getElementById("content");
  var msg = document.getElementById("msg");
  var W = 0, H = 0;               // natural size of the drawing
  var scale = 1, tx = 0, ty = 0;  // current transform
  var fitScale = 1;
  var MAXZOOM = 12;               // x of fit scale

  function apply(){ content.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")"; }

  // keep drawing inside the screen (centered when smaller than the screen)
  function clamp(){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var cw = W * scale, ch = H * scale;
    if (cw <= sw) tx = (sw - cw) / 2; else tx = Math.min(0, Math.max(sw - cw, tx));
    if (ch <= sh) ty = (sh - ch) / 2; else ty = Math.min(0, Math.max(sh - ch, ty));
  }

  function computeFit(){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    fitScale = Math.min(sw / W, sh / H);
  }

  function fitAll(){
    computeFit();
    scale = fitScale; clamp(); apply();
  }

  function zoomAt(newScale, cx, cy){
    newScale = Math.max(fitScale, Math.min(fitScale * MAXZOOM, newScale));
    var k = newScale / scale;
    tx = cx - (cx - tx) * k;
    ty = cy - (cy - ty) * k;
    scale = newScale;
    clamp(); apply();
  }

  function isImg(f){ return /\.(png|jpe?g|gif|webp|bmp)$/i.test(f); }

  function setup(w, h){
    W = w; H = h;
    content.style.width = W + "px";
    content.style.height = H + "px";
    msg.style.display = "none";
    fitAll();
  }

  function load(){
    if (!file) { msg.textContent = "No file specified"; return; }
    var url = encodeURI(file);
    if (isImg(file)){
      var im = new Image();
      im.draggable = false;
      im.onload = function(){
        im.style.display = "block";
        im.style.width = im.naturalWidth + "px";
        im.style.height = im.naturalHeight + "px";
        content.appendChild(im);
        setup(im.naturalWidth, im.naturalHeight);
      };
      im.onerror = function(){ msg.textContent = "Cannot load file"; };
      im.src = url;
      return;
    }
    fetch(url).then(function(r){
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(txt){
      content.innerHTML = txt;
      var svg = content.querySelector("svg");
      if (!svg) throw new Error("not svg");
      var vb = svg.viewBox && svg.viewBox.baseVal;
      var w = parseFloat(svg.getAttribute("width")), h = parseFloat(svg.getAttribute("height"));
      var nw, nh;
      if (vb && vb.width && vb.height) { nw = vb.width; nh = vb.height; }
      else if (w && h) { nw = w; nh = h; }
      else { var bb = svg.getBBox(); nw = bb.x + bb.width; nh = bb.y + bb.height; }
      svg.setAttribute("width", nw);
      svg.setAttribute("height", nh);
      svg.style.width = nw + "px";
      svg.style.height = nh + "px";
      setup(nw, nh);
    }).catch(function(){
      msg.textContent = "Cannot load file";
    });
  }

  // ---- links inside the drawing (numbers / parts): open them inside this viewer ----
  var FILE_RE = /([^'"\s()=]+\.(?:svg|png|jpe?g|gif|webp|bmp|pdf|html?))(?:[?#][^'"\s)]*)?/i;
  var ATTRS = ["href", "xlink:href", "onclick", "data-href", "data-src", "data-url", "data-link", "data-file"];

  // finds where an element (or one of its parents) wants to go: <a href>, onclick="...", data-*
  function targetOf(el){
    while (el && el !== stage && el.getAttribute){
      var isA = el.tagName && el.tagName.toLowerCase() === "a";
      for (var i = 0; i < ATTRS.length; i++){
        var v = el.getAttribute(ATTRS[i]);
        if (!v) continue;
        if (v.charAt(0) === "#") continue;
        if (isA && (ATTRS[i] === "href" || ATTRS[i] === "xlink:href")) return v;
        var m = v.match(FILE_RE);
        if (m) return m[0];
      }
      el = el.parentNode;
    }
    return null;
  }

  function openLink(h){
    var base = new URL(encodeURI(file), location.href);
    var u;
    try { u = new URL(h, base); } catch(e){ return false; }
    var dir = location.pathname.replace(/[^\/]*$/, "");
    var local = u.origin === location.origin && u.pathname.indexOf(dir) === 0;
    var name = local ? decodeURIComponent(u.pathname.slice(dir.length)) : "";
    if (local && (/\.svg$/i.test(name) || isImg(name))){
      location.href = "viewer.html?f=" + encodeURIComponent(name);
    } else {
      location.href = u.href;     // pdf, html, etc.
    }
    return true;
  }

  // block the drawing's own click handling / link navigation; openLink() does it instead
  stage.addEventListener("click", function(e){
    if (targetOf(e.target)){ e.preventDefault(); e.stopPropagation(); }
  }, true);

  // ---- gestures: one finger = pan, two fingers = pinch zoom, double tap = zoom ----
  var pts = {};           // active pointers
  var startDist = 0, startScale = 1, lastTap = 0, moved = false, lastTapX = 0, lastTapY = 0;

  function count(){ return Object.keys(pts).length; }
  function two(){
    var k = Object.keys(pts);
    return [pts[k[0]], pts[k[1]]];
  }

  stage.addEventListener("pointerdown", function(e){
    if (!W) return;
    stage.setPointerCapture(e.pointerId);
    pts[e.pointerId] = {x: e.clientX, y: e.clientY};
    moved = false;
    if (count() === 2){
      var p = two();
      startDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      startScale = scale;
    }
  });

  stage.addEventListener("pointermove", function(e){
    if (!pts[e.pointerId]) return;
    var old = pts[e.pointerId];
    var nx = e.clientX, ny = e.clientY;
    if (count() === 1){
      var dx = nx - old.x, dy = ny - old.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      tx += dx; ty += dy;
      clamp(); apply();
      pts[e.pointerId] = {x: nx, y: ny};
    } else if (count() === 2){
      pts[e.pointerId] = {x: nx, y: ny};
      var p = two();
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      var r = stage.getBoundingClientRect();
      var cx = (p[0].x + p[1].x) / 2 - r.left, cy = (p[0].y + p[1].y) / 2 - r.top;
      if (startDist > 0) zoomAt(startScale * d / startDist, cx, cy);
      moved = true;
    }
  });

  function up(e){
    if (!pts[e.pointerId]) return;
    var wasOne = count() === 1;
    delete pts[e.pointerId];
    if (count() === 1){
      // continue panning with the remaining finger
      var k = Object.keys(pts)[0];
      pts[k] = {x: pts[k].x, y: pts[k].y};
    }
    if (wasOne && !moved && e.type === "pointerup"){
      var tg = targetOf(document.elementFromPoint(e.clientX, e.clientY));
      if (tg && openLink(tg)) return;
      var now = Date.now();
      var r = stage.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      if (now - lastTap < 320 && Math.hypot(x - lastTapX, y - lastTapY) < 40){
        if (scale > fitScale * 1.2) fitAll();
        else zoomAt(fitScale * 3, x, y);
        lastTap = 0;
      } else { lastTap = now; lastTapX = x; lastTapY = y; }
    }
  }
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);

  // mouse wheel (desktop)
  stage.addEventListener("wheel", function(e){
    if (!W) return;
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomAt(scale * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});

  // block the browser's own pinch/gesture zoom
  ["gesturestart","gesturechange","gestureend"].forEach(function(n){
    document.addEventListener(n, function(e){ e.preventDefault(); });
  });

  document.getElementById("fit").onclick = fitAll;

  // keep the view valid when the screen rotates / resizes
  var wasFit = true;
  window.addEventListener("resize", function(){
    if (!W) return;
    var atFit = Math.abs(scale - fitScale) < 0.001;
    setTimeout(function(){
      computeFit();
      if (atFit || scale < fitScale) scale = fitScale;
      clamp(); apply();
    }, 150);
  });

  load();
})();
</script>
</body>
</html>
