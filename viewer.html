<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{
var u=location.pathname,k="d62chk_"+u;
if(sessionStorage.getItem(k)==="1")return;
sessionStorage.setItem(k,"1");
Promise.all([fetch(u,{cache:"no-store"}).then(function(r){return r.text()}),fetch(u).then(function(r){return r.text()})]).then(function(a){
 if(a[0]!==a[1]){var q=location.search.replace(/([?&])_c=\d+&?/,"$1").replace(/[?&]$/,"");location.replace(u+(q?q+"&":"?")+"_c="+Date.now()+location.hash);}
}).catch(function(){});
}catch(e){}})();</script>
<title>D62 - Drawing</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
#st{position:fixed;left:0;top:0;width:100vw;height:100vh;display:flex;flex-direction:column}
#bar{flex:0 0 34px;background:#1f6fb5;color:#fff;display:flex;align-items:center;padding:0 10px;font-size:15px;box-sizing:border-box}
#bar a{color:#fff;text-decoration:none;border:1px solid #fff;border-radius:3px;padding:3px 10px;margin-right:12px}
#bar span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#v{flex:1 1 auto;width:100%;border:0;background:#fff}
@media (orientation:portrait) and (max-width:900px) and (hover:none) and (pointer:coarse){
 #st{width:100vh;height:100vw;left:100vw;transform-origin:0 0;transform:rotate(90deg)}
}
</style>
</head>
<body>
<div id="st">
<div id="bar"><a href="index.html" id="back">&#8592; Back</a><span id="nm"></span></div>
<iframe id="v" title="drawing"></iframe>
</div>
<script>
(function(){
try{if(sessionStorage.getItem("d62ok")!=="1"){location.replace("index.html");return;}}catch(e){}
var f=new URLSearchParams(location.search).get("f")||"";
if(!/^[A-Za-z0-9_ ().\-]+\.svg$/i.test(f)){document.getElementById("nm").textContent="Invalid file";return;}
document.getElementById("nm").textContent=f;
document.title="D62 - "+f;
document.getElementById("v").src=encodeURIComponent(f).replace(/%28/g,"(").replace(/%29/g,")");
document.getElementById("back").addEventListener("click",function(e){if(history.length>1){e.preventDefault();history.back();}});
})();
</script>
</body>
</html>
